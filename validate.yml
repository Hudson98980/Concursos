name: Validar projeto
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m json.tool data/database.json >/dev/null
      - run: python -m json.tool automation/sources.json >/dev/null
      - run: python -m json.tool automation/schema.json >/dev/null
      - run: python -m py_compile automation/monitor.py

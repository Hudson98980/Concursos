name: Monitor de concursos
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Monitorar fontes e atualizar base
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
        run: python automation/monitor.py
      - name: Commit das alterações
        run: |
          git config user.name "concursos-brasil-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/database.json data/runtime.js
          git diff --cached --quiet || git commit -m "chore: atualização automática de concursos"
          git push
